<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2420;
    --title:#C1481B;
    --bg:#FBF6F1;
    --surface:#FFFFFF;
    --accent:#E2652B;
    --accent-dark:#B84F1F;
    --accent-soft:#FBEAE0;
    --warn:#B23A3A;
    --warn-dark:#8C2E2E;
    --line:#EAE0D5;
    --muted:#8A7A6E;
    --font-body:12px;
    --font-sub:10px;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:var(--font-body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Sora',sans-serif;margin:0;color:var(--title);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:var(--font-body);}

  .app-shell{max-width:960px;margin:0 auto;padding:0 0 64px;}

  .app-bar{
    background:var(--ink);
    color:#F5E9DD;
    padding:18px 20px 14px;
    position:sticky;top:0;z-index:20;
  }
  .app-bar .title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .app-bar h1{font-size:19px;color:#fff;letter-spacing:0.2px;}
  .btn-salvar-topo{
    margin-top:10px;background:var(--accent);color:#fff;border:none;
    padding:9px 16px;border-radius:8px;font-size:var(--font-body);font-weight:700;
    width:100%;
  }
  .btn-salvar-topo:hover{background:var(--accent-dark);}
  .app-bar .subtitle{font-size:var(--font-sub);color:#E7BE9C;text-transform:uppercase;letter-spacing:0.08em;}
  .sync-note{font-size:var(--font-sub);color:#D9B79A;margin-top:6px;max-width:640px;}

  .tabs{
    display:flex;gap:10px;padding:14px 20px;background:var(--surface);
    border-bottom:1px solid var(--line);
    align-items:center;position:relative;flex-wrap:wrap;
  }
  .segmented{
    display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;
  }
  .segmented .seg-btn{
    background:transparent;border:none;color:var(--muted);
    padding:8px 16px;font-size:var(--font-body);font-weight:600;border-radius:999px;
    white-space:nowrap;
  }
  .segmented .seg-btn.active{background:var(--accent);color:#fff;}

  .menu-wrap{position:relative;margin-left:auto;}
  .hamburger-btn{
    background:var(--surface);border:1px solid var(--line);color:var(--ink);
    padding:8px 14px;font-size:12px;font-weight:600;border-radius:999px;
    white-space:nowrap;display:flex;align-items:center;gap:6px;
  }
  .hamburger-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dark);}
  .hamburger-btn .bars{font-size:15px;line-height:1;}
  .hamburger-btn .cur{font-size:var(--font-sub);font-weight:600;color:var(--accent-dark);}
  .dropdown-menu{
    position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;
    box-shadow:0 14px 30px rgba(43,36,32,0.16);min-width:230px;z-index:50;
    overflow:hidden;padding:6px;
  }
  .dropdown-group-label{
    font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);
    font-weight:700;padding:10px 10px 4px;
  }
  .dropdown-menu button{
    display:block;width:100%;text-align:left;background:none;border:none;
    padding:9px 10px;font-size:var(--font-body);color:var(--ink);border-radius:8px;
  }
  .dropdown-menu button:hover{background:var(--accent-soft);}
  .dropdown-menu button.active{color:var(--accent-dark);font-weight:700;background:var(--accent-soft);}
  .dropdown-divider{height:1px;background:var(--line);margin:6px 4px;}

  main{padding:18px 20px 40px;}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 16px 18px;
    margin-bottom:14px;
  }
  .section-title{
    font-size:var(--font-sub);
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--title);
    font-weight:700;
    margin-bottom:10px;
    display:flex;align-items:center;gap:8px;
    font-family:'Sora',sans-serif;
  }
  .section-title::before{
    content:"";width:14px;height:2px;background:var(--accent);display:inline-block;
  }

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
  .field-grid.single{grid-template-columns:1fr;}
  @media(max-width:640px){.field-grid{grid-template-columns:1fr;}}

  .field label{
    display:block;font-size:var(--font-sub);color:var(--muted);
    margin-bottom:4px;font-weight:600;letter-spacing:0.02em;
  }
  .field input[type=text],.field input[type=tel],.field input[type=email],
  .field input[type=date],.field select,.field textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;
    background:#FFFCF9;color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:56px;}
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);
  }
  .field.required label::after{content:" *";color:var(--warn);}

  .select-with-add{display:flex;gap:6px;align-items:stretch;}
  .select-with-add select{flex:1;min-width:0;}
  .btn-quickadd{
    flex:none;width:38px;border-radius:7px;border:1px solid var(--line);
    background:#fff;color:var(--accent-dark);font-size:17px;font-weight:700;
  }
  .btn-quickadd:hover{background:var(--accent-soft);border-color:var(--accent);}

  .addr-row{display:flex;gap:8px;align-items:flex-start;}
  .addr-row textarea{flex:1;}
  .btn{
    border:none;border-radius:7px;padding:8px 14px;font-size:var(--font-body);
    font-weight:600;display:inline-flex;align-items:center;gap:6px;
  }
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:hover{background:var(--accent-dark);}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--accent);color:var(--accent-dark);}
  .btn-warn{background:#fff;border:1px solid var(--warn);color:var(--warn);}
  .btn-warn:hover{background:var(--warn);color:#fff;}
  .btn-sm{padding:6px 10px;font-size:var(--font-sub);}
  .btn:disabled{opacity:0.55;cursor:not-allowed;}

  .btn-confirm-addr{white-space:nowrap;}
  .spinner{
    width:12px;height:12px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;
    animation:spin .7s linear infinite;display:inline-block;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .photo-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;align-items:flex-start;}
  .photo-thumb{
    position:relative;width:74px;height:74px;border-radius:8px;overflow:hidden;
    border:1px solid var(--line);background:#eee;flex:none;
  }
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .rm{
    position:absolute;top:2px;right:2px;background:rgba(22,50,58,0.75);color:#fff;
    border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;
  }
  /* Initial photo field: a clearly visible rectangular upload box */
  .photo-placeholder{
    width:100%;max-width:230px;min-height:96px;border-radius:10px;
    border:1.5px dashed var(--accent);background:#FBEAE0;color:var(--accent-dark);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;text-align:center;padding:14px;flex:none;
  }
  .photo-placeholder:hover{background:#F6D9C7;}
  .photo-placeholder .ic{font-size:22px;line-height:1;}
  .photo-placeholder .txt{font-size:var(--font-sub);font-weight:600;}
  /* Circular add button: shown beside existing photos to add more, no limit */
  .photo-add-round{
    width:40px;height:40px;border-radius:50%;border:1.5px dashed var(--accent);
    background:#FBEAE0;color:var(--accent-dark);display:flex;align-items:center;
    justify-content:center;font-size:20px;font-weight:700;flex:none;align-self:center;
  }
  .photo-add-round:hover{background:#F6D9C7;}
  .photo-label{font-size:var(--font-sub);color:var(--muted);margin-bottom:6px;font-weight:600;}

  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap;}

  /* Manifest-style tag chips (signature element) */
  .tag-chip{
    display:inline-flex;align-items:center;gap:6px;
    border:1px dashed var(--line);border-radius:6px;padding:3px 8px 3px 6px;
    font-size:var(--font-sub);color:var(--muted);background:#FBF7F3;
  }
  .tag-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;}
  .tag-chip.mono span{font-family:'IBM Plex Mono',monospace;color:var(--ink);}

  .search-box{display:flex;gap:8px;margin-bottom:12px;}
  .search-box input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:var(--font-body);}
  .result-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;}
  .result-item{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;
    text-align:left;width:100%;
  }
  .result-item:hover{border-color:var(--accent);}
  .result-item .name{font-weight:600;}
  .result-item .meta{color:var(--muted);font-size:var(--font-sub);}

  .empty-state{
    text-align:center;padding:36px 16px;color:var(--muted);
  }
  .empty-state .big{font-size:28px;margin-bottom:8px;}

  .ficha-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;}
  @media(max-width:640px){.ficha-grid{grid-template-columns:1fr;}}
  .ficha-item .k{font-size:var(--font-sub);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;}
  .ficha-item .v{font-size:var(--font-body);color:var(--ink);margin-top:2px;word-break:break-word;}
  .ficha-item .v.empty{background:#92D050;border-radius:5px;display:block;width:80px;height:20px;}
  .edit-mode .field input:placeholder-shown, .edit-mode .field textarea:placeholder-shown{background:#92D050;}
  .ficha-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .ficha-header h2{font-size:17px;}
  .ficha-header .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .ficha-photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
  .ficha-photos img{width:74px;height:74px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}

  .list-manager-add{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .list-manager-add input{flex:1;min-width:140px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;}
  .list-manager-items{display:flex;flex-direction:column;gap:6px;}
  .list-manager-row{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;
  }
  .list-manager-row .txt{font-size:var(--font-body);}
  .list-manager-row .sub{font-size:var(--font-sub);color:var(--muted);font-family:'IBM Plex Mono',monospace;}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;
    font-size:var(--font-body);z-index:100;box-shadow:0 6px 18px rgba(0,0,0,0.2);
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(22,50,58,0.45);
    display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;
  }
  .modal-box{
    background:#fff;border-radius:12px;padding:20px;max-width:340px;width:100%;
  }
  .modal-box p{font-size:var(--font-body);margin:0 0 16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}

  .lightbox-overlay{
    position:fixed;inset:0;background:rgba(10,8,6,0.92);
    display:flex;align-items:center;justify-content:center;z-index:600;padding:24px;
  }
  .lightbox-overlay img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,0.5);}
  .lightbox-close{
    position:fixed;top:16px;right:16px;background:rgba(255,255,255,0.15);color:#fff;
    border:none;border-radius:50%;width:42px;height:42px;font-size:24px;line-height:1;z-index:601;
  }
  .lightbox-close:hover{background:rgba(255,255,255,0.28);}

  .stat-strip{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
  .top-scroller{
    overflow:hidden;margin-bottom:8px;position:relative;background:#FFE699;border-radius:8px;
    padding:6px 0;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);
    mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);
  }
  .top-scroller-track{display:flex;align-items:center;gap:12px;width:max-content;white-space:nowrap;animation:tickerScroll 16s linear infinite;padding:0 14px;}
  .top-scroller:hover .top-scroller-track{animation-play-state:paused;}
  .top-scroller .stat-pill{
    flex:none;white-space:nowrap;background:transparent;border:none;
    padding:0 10px;min-width:0;gap:0;border-right:1px solid rgba(43,36,32,0.15);
  }
  .top-scroller .stat-pill:last-child{border-right:none;}
  .top-scroller .stat-pill .n{font-size:14px;line-height:1.3;height:18px;overflow:hidden;}
  .top-scroller .stat-pill .l{font-size:9px;line-height:1.3;}
  @keyframes tickerScroll{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }
  .local-mode-banner{
    background:#FBEAE0;border-bottom:1px solid var(--accent);color:var(--accent-dark);
    padding:10px 20px;font-size:var(--font-sub);font-weight:600;
  }
  .aniversario-banner{
    background:#FFF4CC;border-bottom:1px solid #E0B93C;color:#7A5C00;
    padding:10px 20px;font-size:var(--font-sub);font-weight:600;
  }
  .aniversario-banner strong{color:var(--accent-dark);}
  .stat-pill{
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:88px;
  }
  .stat-pill .n{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--ink);}
  .stat-pill .l{font-size:var(--font-sub);color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;}

  .helptext{font-size:var(--font-sub);color:var(--muted);margin-top:4px;}

  /* Equipamentos (máquinas / balança) */
  .equip-block{grid-column:1/-1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#FFFCF9;}
  .equip-block label{margin-bottom:6px;}
  .equip-block select.possui{max-width:160px;}
  .equip-details{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}

  .equip-details input[type=number]{width:120px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;}

  .servico-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .servico-row .field{flex:1;min-width:150px;}
  .servico-list-item{

  .servico-list-item .main{font-weight:600;}
  .servico-list-item .meta{font-size:var(--font-sub);color:var(--muted);margin-top:2px;}
  .servico-list-item .notas{font-size:var(--font-sub);color:var(--ink);margin-top:4px;font-style:italic;}

  /* Relatório de Máquinas */
  .report-table{width:100%;border-collapse:collapse;font-size:var(--font-body);}
  .report-table th,.report-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
  .report-table th{font-size:var(--font-sub);text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);}
  .report-table td.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .report-total-row td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none;}

    .app-shell{max-width:100%;}
    main{padding:0;}
    .card{border:none;padding:0;margin-bottom:18px;}
  }
  .print-title{display:none;}
  @media print{ .print-title{display:block;font-size:16px;margin-bottom:10px;font-family:'Sora',sans-serif;} }

  /* Tela de bloqueio (PIN) */
  .lock-overlay{
    position:fixed;inset:0;background:var(--bg);z-index:500;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .lock-card{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:34px 28px;max-width:340px;width:100%;text-align:center;
    box-shadow:0 20px 50px rgba(43,36,32,0.14);
  }
  .lock-icon{
    width:56px;height:56px;border-radius:16px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:24px;color:#fff;
  }
  .lock-card h2{font-size:17px;margin-bottom:6px;}
  .lock-card p{font-size:var(--font-body);color:var(--muted);margin:0 0 18px;}
  .pin-visible-input{
    width:160px;margin:0 auto 4px;display:block;
    text-align:center;font-size:26px;letter-spacing:14px;
    padding:12px 0 12px 14px;border:1.5px solid var(--line);border-radius:10px;
    font-family:'IBM Plex Mono',monospace;color:var(--ink);background:#FFFCF9;
  }
  .pin-visible-input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .lock-error{color:var(--warn);font-size:var(--font-sub);min-height:16px;margin-bottom:6px;font-weight:600;}
  .lock-forgot{
    font-size:var(--font-sub);color:var(--muted);text-decoration:underline;
    background:none;border:none;margin-top:16px;cursor:pointer;padding:4px;
  }
  .lock-forgot:hover{color:var(--accent-dark);}
</style>
</head>

/* ===================== STORAGE HELPERS (IndexedDB — muito mais espaço que localStorage) ===================== */
const STORAGE_PREFIX = 'cadastro_clientes:';
const IDB_NAME = 'cadastro_clientes_db';
const IDB_STORE = 'kv';
let idbInstancePromise = null;

function openAppDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{
      if(!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE);
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
function getDB(){
  if(!idbInstancePromise) idbInstancePromise = openAppDB();
  return idbInstancePromise;
}

let ultimoErroStoreSet = null;
async function storeGet(key){
  try{
    const db = await getDB();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = ()=>resolve(req.result===undefined ? null : req.result);
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){ return null; }
}
async function storeSet(key, value){
  try{
    const db = await getDB();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    });
    return true;
  }catch(e){
    ultimoErroStoreSet = { key, tamanho: value ? value.length : 0, erro: (e && (e.name+': '+e.message)) || String(e) };
    return false;
  }
}
async function storeDelete(key){
  try{
    const db = await getDB();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    });
    return true;
  }catch(e){ return false; }
}
async function loadListKey(key){
  const raw = await storeGet(key);
  if(raw===null) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}

/* Migração única e automática: copia tudo que já existia no localStorage
   (do modelo antigo) para o IndexedDB novo, na primeira vez que abrir com esta versão.
   Não apaga o localStorage antigo — só copia, por segurança. */
async function migrarStorageAntigoSeNecessario(){
  try{
    const jaMigrado = await storeGet('__migrado_idb__');
    if(jaMigrado) return;
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(STORAGE_PREFIX)===0){
        const chaveReal = k.slice(STORAGE_PREFIX.length);
        const valor = localStorage.getItem(k);
        if(valor!==null) await storeSet(chaveReal, valor);
      }
    }
    await storeSet('__migrado_idb__', '1');
  }catch(e){ /* não crítico: se falhar, o app segue funcionando normalmente */ }
}

/* Loads a client's full record, materializing it from the original spreadsheet
   seed on first access (instead of writing all records upfront on load). */
async function getClientRecord(id){
  const raw = await storeGet('cliente:'+id);
  if(raw){
    try{ return JSON.parse(raw); }catch(e){ /* fall through */ }
  }
  const seedRec = SEED_CLIENTES_BY_ID[id];
  if(seedRec){
    storeSet('cliente:'+id, JSON.stringify(seedRec)); // fire-and-forget, no need to block the view
    return seedRec;
  }
  return null;
}

function uid(){ return Math.random().toString(16).slice(2,10); }
function esc(s){ return (s===undefined||s===null)? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function normalize(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}
function openModal(html){
  const root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="modal-overlay" id="modalOverlay">'+html+'</div>';
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{
    if(e.target.id==='modalOverlay') closeModal();
  });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* Visualizador de foto em tela cheia — só amplia, não interfere em nenhum
   botão/função de foto já existente (adicionar, remover, etc). */
function abrirFotoAmpliada(src){
  if(!src) return;
  const root = document.getElementById('lightboxRoot');
  root.innerHTML = `
    <div class="lightbox-overlay" id="lightboxOverlay">
      <button class="lightbox-close" onclick="fecharFotoAmpliada()" title="Fechar">×</button>
      <img src="${src}">
    </div>
  `;
  document.getElementById('lightboxOverlay').addEventListener('click', (e)=>{
    if(e.target.id==='lightboxOverlay') fecharFotoAmpliada();
  });
  document.addEventListener('keydown', handleLightboxKeydown);
}
function fecharFotoAmpliada(){
  document.getElementById('lightboxRoot').innerHTML = '';
  document.removeEventListener('keydown', handleLightboxKeydown);
}
function handleLightboxKeydown(e){
  if(e.key === 'Escape') fecharFotoAmpliada();
}

function confirmAction(message, onConfirm){
  openModal(`
    <div class="modal-box">
      <p>${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-warn" id="modalConfirmBtn">Confirmar</button>
      </div>
    </div>
  `);
  document.getElementById('modalConfirmBtn').addEventListener('click', async ()=>{
    closeModal();
    await onConfirm();
  });
}

/* ===================== IMAGE HANDLING ===================== */
function readAndCompressImage(file, maxWidth){
  maxWidth = maxWidth || 700;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read fail'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('img fail'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * (maxWidth/w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.55));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handlePhotoInput(evt, fieldKey){
  const files = Array.from(evt.target.files || []);
  if(!files.length) return;
  toast('Processando foto(s)…');
  for(const f of files){
    try{
      const dataUrl = await readAndCompressImage(f, 1000);
      draftImages[fieldKey].push(dataUrl);
    }catch(e){ /* ignore failed image, continue with the rest */ }
  }
  evt.target.value = '';
  refreshPhotoRow(fieldKey);
}

async function buscarEnderecoNominatim(){
  const el = document.getElementById('f_endereco');
  const original = (el.value || '').trim();
  if(!original){ toast('Digite ao menos parte do endereço antes de buscar.'); return; }
  const btn = document.getElementById('btnBuscarEndereco');
  const originalLabel = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Buscando…';
  try{
    const url = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=0&limit=1&countrycodes=br&q=' + encodeURIComponent(original);
    const resp = await fetch(url, { headers: { 'Accept':'application/json' } });
    const data = await resp.json();
    if(data && data.length){
      el.value = data[0].display_name;
      toast('Endereço encontrado.');
    }else{
      toast('Nenhum endereço encontrado. Tente detalhar mais (bairro, cidade).');
    }
  }catch(e){
    toast('Erro ao buscar endereço. Verifique a conexão e tente novamente.');
  }
  btn.disabled = false;
  btn.innerHTML = originalLabel;
}

function maskIE(el){
  let d = el.value.replace(/\D/g,'').slice(0,9);
  let out = d;
  if(d.length>8) out = d.replace(/(\d{2})(\d{6})(\d{1})/, '$1-$2-$3');
  else if(d.length>2) out = d.replace(/(\d{2})(\d{1,6})/, '$1-$2');
  el.value = out;
}
function maskCPF(el){
  let d = el.value.replace(/\D/g,'').slice(0,11);
  let out = d;
  if(d.length>9) out = d.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
  else if(d.length>6) out = d.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
  else if(d.length>3) out = d.replace(/(\d{3})(\d{1,3})/, '$1.$2');
  el.value = out;
}
function maskCNPJ(el){
  let d = el.value.replace(/\D/g,'').slice(0,14);
  let out = d;
  if(d.length>12) out = d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{1,2})/, '$1.$2.$3/$4-$5');
  else if(d.length>8) out = d.replace(/(\d{2})(\d{3})(\d{3})(\d{1,4})/, '$1.$2.$3/$4');
  else if(d.length>5) out = d.replace(/(\d{2})(\d{3})(\d{1,3})/, '$1.$2.$3');
  else if(d.length>2) out = d.replace(/(\d{2})(\d{1,3})/, '$1.$2');
  el.value = out;
}
function maskTelefone(el){
  let d = el.value.replace(/\D/g,'').slice(0,11);
  let out = d;
  if(d.length>10) out = d.replace(/(\d{2})(\d{5})(\d{1,4})/, '($1) $2-$3');
  else if(d.length>6) out = d.replace(/(\d{2})(\d{4})(\d{1,4})/, '($1) $2-$3');
  else if(d.length>2) out = d.replace(/(\d{2})(\d{1,5})/, '($1) $2');
  else if(d.length>0) out = d.replace(/(\d{1,2})/, '($1');
  el.value = out;
}

function anivFieldHTML(idPrefix, currentValue){
  let display = '';
  if(currentValue){
    if(/^\d{4}-\d{2}-\d{2}$/.test(currentValue)){
      const parts = currentValue.split('-');
      display = parts[2]+'/'+parts[1];
    }else if(/^\d{1,2}\/\d{1,2}$/.test(currentValue)){
      const parts = currentValue.split('/');
      display = parts[0].padStart(2,'0')+'/'+parts[1].padStart(2,'0');
    }
  }
  return `<input type="text" inputmode="numeric" maxlength="5" id="${idPrefix}" placeholder="DD/MM" value="${esc(display)}" oninput="maskAnivInput(this)">`;
}
function maskAnivInput(el){
  let digits = el.value.replace(/[^0-9]/g,'').slice(0,4);
  el.value = digits.length > 2 ? (digits.slice(0,2) + '/' + digits.slice(2)) : digits;
}
function collectAnivValue(idPrefix){
  const el = document.getElementById(idPrefix);
  const val = el ? el.value.trim() : '';
  const m = /^(\d{1,2})\/(\d{1,2})$/.exec(val);
  if(!m) return '';
  return m[1].padStart(2,'0') + '/' + m[2].padStart(2,'0');
}
function formatAnivDisplay(val){
  if(!val) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(val)){
    const parts = val.split('-');
    return parts[2]+'/'+parts[1];
  }
  return val;
}

function collectFormData(existingId){
  const ids = ['cliente','nomeFantasia','municipio','regiao','rota','classificacao','codLj','condPgto',
    'cnpj','inscEstadual','endereco','fixo','celular','celularII','emailLoja','emailNF',
    'proprietario','cpfProp','identProp','administrador','colaboradores','mimo',
    'maqSkylackPossui','maqSkylackTipo','maqSkylackQtd',
    'maqSkyfrotaPossui','maqSkyfrotaTipo','maqSkyfrotaQtd',
    'balancaPossui','balancaTipo','balancaQtd','obsEquipamentos'];
  const rec = { id: existingId || uid() };
  ids.forEach(k=>{
    const el = document.getElementById('f_'+k);
    rec[k] = el ? el.value.trim() : '';
  });
  rec.anivProp = collectAnivValue('f_anivProp');
  rec.anivAdm = collectAnivValue('f_anivAdm');
  rec.imagensInt = draftImages.imagensInt.slice();
  rec.imagensExt = draftImages.imagensExt.slice();
  rec.imagensGoogle = draftImages.imagensGoogle.slice();
  rec.imagensEquipamentos = draftImages.imagensEquipamentos.slice();
  rec.obsImagens = '';
  EQUIP_KEYS.forEach(k=>{
    if(rec[k+'Possui'] !== 'sim'){
      rec[k+'Tipo'] = '';
      rec[k+'Qtd'] = '';
    }
  });
  syncTransportadoraDraftFromDOM();
  rec.transportadoras = draftTransportadoras.filter(t=>t.transportadora);
  syncTintaProntaDraftFromDOM();
  rec.tintaPronta = draftTintaPronta.filter(m=>m);
  return rec;
}

async function submitClientForm(mode, existingId){
  const clienteEl = document.getElementById('f_cliente');
  if(!clienteEl.value.trim()){
    toast('Informe o nome do Cliente antes de salvar.');
    clienteEl.focus();
    return;
  }
  const rec = collectFormData(mode==='edit' ? existingId : null);
  const salvouCliente = await storeSet('cliente:'+rec.id, JSON.stringify(rec));
  fichaCache[rec.id] = rec;
  if(mode==='edit'){
    const i = clientesIndex.findIndex(c=>c.id===rec.id);
    if(i>=0) clientesIndex[i] = buildIndexEntry(rec);
  }else{
    clientesIndex.push(buildIndexEntry(rec));
  }
  const salvouIndice = await storeSet('clientes-index', JSON.stringify(clientesIndex));
  if(!salvouCliente || !salvouIndice){
    const detalhe = ultimoErroStoreSet ? `<p style="font-size:var(--font-sub);color:var(--muted);margin-top:10px;font-family:monospace;">Detalhe técnico: ${esc(ultimoErroStoreSet.erro)} (tamanho do registro: ${(ultimoErroStoreSet.tamanho/1024).toFixed(0)} KB)</p>` : '';
    openModal(`
      <div class="modal-box">
        <p style="font-weight:700;color:var(--warn);margin-bottom:8px;">⚠ Não foi possível salvar no navegador</p>
        <p style="font-size:var(--font-body);">Esta alteração ficou só nesta tela, por enquanto — não foi gravada de forma definitiva (provavelmente o armazenamento deste navegador está cheio). <strong>Exporte um backup agora</strong> (Mais → Dados → Salvar Backup) antes de continuar, para não correr risco de perder este trabalho.</p>
        ${detalhe}
        <div class="modal-actions"><button class="btn btn-accent" onclick="closeModal()">Entendi</button></div>
      </div>
    `);
  }else{
    toast(mode==='edit' ? 'Cliente atualizado.' : 'Cliente cadastrado.');
  }
  if(mode==='edit'){
    consultaEditMode = false;
    consultaSelectedId = rec.id;
    renderContent();
  }else{
    resetCadastroForm();
  }
}

function searchResultsHTML(query){
  const q = normalize(query);
  let list = filtroRegiao==='todas' ? clientesIndex : clientesIndex.filter(c=>c.regiao===filtroRegiao);
  if(q){
    list = list.filter(c=>normalize(c.cliente).includes(q));
  }
  list = list.slice().sort((a,b)=>a.cliente.localeCompare(b.cliente,'pt-BR'));
  if(!list.length){
    return `<div class="empty-state"><div class="big">🔎</div>Nenhum cliente encontrado${filtroRegiao==='todas'?'':' nesta região'}.</div>`;
  }
  const shown = q ? list : list.slice(0,25);
  let extra = (!q && list.length>25) ? `<div class="helptext" style="text-align:center;margin-top:6px;">Mostrando 25 de ${list.length}. Digite para refinar a busca.</div>` : '';
  return shown.map(c=>`
    <button class="result-item" onclick="selectCliente('${c.id}')">
      <span>
        <div class="name">${esc(c.cliente)}</div>
        <div class="meta">${esc(c.municipio||'—')} ${c.classificacao? '· '+esc(c.classificacao):''}</div>
      </span>
      <span class="tag-chip mono"><span class="dot"></span><span>${esc(c.id)}</span></span>
    </button>
  `).join('') + extra;
}

}
function handleFiltroRegiaoChange(){

  }).join('');

        </div>
        <div class="form-actions" style="margin:0;">

  if(!iso) return '';
  const parts = iso.split('-');
  if(parts.length!==3) return iso;
  return parts[2]+'/'+parts[1]+'/'+parts[0];
}

async function gerarPdfServicos(){
  const data = window.__relatorioServicosData;
  if(!data || !data.ordenados.length){ toast('Nada para gerar ainda.'); return; }

  const marginX = 40;
  const pageTop = 790, pageBottom = 50;
  const lineH = 15;
  const colX = { cliente:marginX, tipo:230, data:370, status:440 };

  let pages = [];
  let currentOps = [];
  let y = pageTop;

  function push(x, yy, text, opts){
    currentOps.push({x:x, y:yy, text:text, size:(opts&&opts.size)||9, bold: !!(opts&&opts.bold)});
  }
  function drawHeader(){
    push(colX.cliente, y, 'Cliente', {bold:true});
    push(colX.tipo, y, 'Servico', {bold:true});
    push(colX.data, y, 'Data', {bold:true});
    push(colX.status, y, 'Status', {bold:true});
    y -= lineH;
  }
  function newPage(withHeader){
    pages.push(currentOps);
    currentOps = [];
    y = pageTop;
    if(withHeader) drawHeader();
  }
  function ensureSpace(needed, withHeader){
    if(y - needed < pageBottom){ newPage(withHeader); }
  }

  push(marginX, y, 'Relatorio de Servicos', {size:15, bold:true});
  y -= 20;
  push(marginX, y, 'Rota Norte - Belem / Para', {size:9});
  y -= 24;
  drawHeader();

  data.ordenados.forEach(s=>{
    ensureSpace(lineH, true);
    push(colX.cliente, y, String(s.clienteNome).slice(0,32));
    push(colX.tipo, y, s.tipo);
    push(colX.data, y, formatDateBR(s.data) || '-');
    push(colX.status, y, s.status || '-');
    y -= lineH;
    if(s.notas && s.notas.trim()){
      ensureSpace(lineH, true);
      const words = String(s.notas).replace(/\r/g,'').split(/\s+/);
      let line = '', wrapped = [];
      words.forEach(w=>{
        if((line+' '+w).trim().length > 100){ wrapped.push(line.trim()); line = w; }
        else line = (line+' '+w).trim();
      });
      if(line) wrapped.push(line);
      wrapped.forEach(ln=>{
        ensureSpace(12, true);
        push(colX.cliente, y, '  '+ln, {size:8});
        y -= 12;
      });
    }
  });

  ensureSpace(lineH*(SERVICO_TIPOS.length+2), false);
  y -= 10;
  push(marginX, y, 'Totais por Servico', {size:12, bold:true});
  y -= 18;
  SERVICO_TIPOS.forEach(t=>{
    ensureSpace(lineH, false);
    push(colX.cliente, y, t, {bold:true});
    push(colX.tipo, y, String(data.totals[t]||0));
    y -= lineH;
  });

  pages.push(currentOps);
  const bytes = buildPdfBytes(pages);
  await downloadPdfBytes(bytes, 'relatorio_servicos.pdf');
  toast('PDF gerado.');
}

}

/* Carrega bibliotecas externas só quando realmente necessário (não mais ao abrir a página) */
const __loadedScripts = {};
function loadExternalScript(url){
  if(__loadedScripts[url]) return __loadedScripts[url];
  __loadedScripts[url] = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = url;
    s.onload = ()=>resolve(true);
    s.onerror = ()=>reject(new Error('Falha ao carregar '+url));
    document.head.appendChild(s);
  });
  return __loadedScripts[url];
}
async function ensureXLSX(){
  if(typeof XLSX !== 'undefined') return true;
  try{ await loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); return true; }
  catch(e){ return false; }
}
async function ensureJSZip(){
  if(typeof JSZip !== 'undefined') return true;
  try{ await loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'); return true; }
  catch(e){ return false; }
}

async function downloadBlob(blob, filename, mimeType){
  if(window.showSaveFilePicker){
    try{
      const ext = filename.includes('.') ? '.'+filename.split('.').pop() : '';
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'Arquivo', accept: { [mimeType]: [ext] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return; // usuário cancelou a caixa de diálogo
      // qualquer outro erro: cai no download tradicional abaixo
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

  const blob = await zip.generateAsync({type:'blob'});

/* ===================== IMPORTAR PLANILHA DE CLIENTES (mescla, não substitui) ===================== */
const PLANILHA_HEADER_MAP = {
  'cliente':'cliente', 'nomefantasia':'nomeFantasia', 'municipio':'municipio',
  'cnpj':'cnpj', 'inscestadual':'inscEstadual', 'endereco':'endereco',
  'fixo':'fixo', 'celular':'celular', 'celularii':'celularII',
  'emailloja':'emailLoja', 'emailnf':'emailNF', 'codlj':'codLj',
  'regiao':'regiao', 'rota':'rota', 'classificacao':'classificacao',
  'condpgto':'condPgto', 'condicaodepagamento':'condPgto',
  'proprietario':'proprietario', 'cpfprop':'cpfProp', 'identprop':'identProp',
  'anivprop':'anivProp', 'administrador':'administrador', 'anivadm':'anivAdm', 'colaboradores':'colaboradores', 'mimo':'mimo',
  'maquinasky':'maqSkylackPossuiRaw', 'maquinaskyqt':'maqSkylackQtd',
  'maquinaskyfrota':'maqSkyfrotaPossuiRaw', 'maquinaskyfrotaqt':'maqSkyfrotaQtd',
  'maquinamultimarca':'balancaPossuiRaw', 'maquinamultimarcaqt':'balancaQtd',
  'observacoesequipamentos':'obsEquipamentos',
  'transportadoradata':'transportadorasRaw',
  'tintapronta':'tintaProntaRaw'
};
function normalizeHeader(h){
  return normalize(String(h||'')).replace(/[^a-z0-9]/g,'');
}
function posProcessarMapeado(mapped){
  [['maqSkylackPossuiRaw','maqSkylackPossui'], ['maqSkyfrotaPossuiRaw','maqSkyfrotaPossui'], ['balancaPossuiRaw','balancaPossui']].forEach(([rawKey,finalKey])=>{
    if(mapped[rawKey] !== undefined){
      mapped[finalKey] = /^s/i.test(mapped[rawKey]) ? 'sim' : 'nao';
      delete mapped[rawKey];
    }
  });
  if(mapped.transportadorasRaw){
    const parts = mapped.transportadorasRaw.split(';').map(s=>s.trim()).filter(Boolean);
    const lista = parts.map(p=>{
      const m = /^(.*?)\s*\((\d{1,2}\/\d{1,2})\)\s*$/.exec(p);
      return m ? {transportadora:m[1].trim(), data:m[2]} : {transportadora:p, data:''};
    });
    if(lista.length) mapped.transportadoras = lista;
    delete mapped.transportadorasRaw;
  }
  if(mapped.tintaProntaRaw){
    const marcas = mapped.tintaProntaRaw.split(';').map(s=>s.trim()).filter(Boolean);
    if(marcas.length) mapped.tintaPronta = marcas;
    delete mapped.tintaProntaRaw;
  }
  return mapped;
}

/* Função única de leitura/validação de linhas de planilha — usada tanto na importação
   dentro do app (mescla) quanto na tela inicial de carregamento (substitui tudo).
   Não grava nada em armazenamento: só lê, mapeia e valida em memória. */
function processarLinhasPlanilha(rows){
  const colunasEncontradas = new Set();
  const colunasIgnoradas = new Set();
  const registros = [];
  rows.forEach(row=>{
    let mapped = {};
    Object.keys(row).forEach(h=>{
      const key = PLANILHA_HEADER_MAP[normalizeHeader(h)];
      if(key){
        colunasEncontradas.add(h);
        const val = row[h];
        mapped[key] = (val===null||val===undefined) ? '' : String(val).trim();
      }else{
        colunasIgnoradas.add(h);
      }
    });
    mapped = posProcessarMapeado(mapped);
    if(!mapped.cliente) return; // linha sem nome de cliente não é um registro válido
    registros.push(mapped);
  });
  return {
    registros,
    colunasEncontradas: Array.from(colunasEncontradas),
    colunasIgnoradas: Array.from(colunasIgnoradas),
    totalLinhas: rows.length
  };
}
/* Mostra, antes de gravar qualquer coisa, quantas linhas foram lidas e quais colunas
   não foram reconhecidas (para não haver mais falha silenciosa de mapeamento). */
function confirmarImportacaoPlanilha(resultado, onConfirm){
  const ignoradasHTML = resultado.colunasIgnoradas.length
    ? `<p style="color:var(--warn);font-weight:600;margin-top:10px;">⚠ Colunas não reconhecidas (serão ignoradas): ${resultado.colunasIgnoradas.map(esc).join(', ')}</p>`
    : '';
  openModal(`
    <div class="modal-box">
      <p style="font-weight:700;margin-bottom:8px;">Confirmar importação</p>
      <p>${resultado.totalLinhas} linha(s) na planilha — ${resultado.registros.length} com cliente identificado.</p>
      ${ignoradasHTML}
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-accent" id="confirmarImportBtn">Continuar</button>
      </div>
    </div>
  `);
  document.getElementById('confirmarImportBtn').addEventListener('click', async ()=>{
    closeModal();
    await onConfirm();
  });
}

async function importarPlanilhaClientes(evt){
  const file = evt.target.files[0];
  evt.target.value = '';
  if(!file) return;
  if(!(await ensureXLSX())){
    toast('Não foi possível carregar o leitor de planilhas (sem conexão?). Tente novamente.');
    return;
  }
  toast('Lendo planilha…');
  let resultado;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheetName = wb.SheetNames.includes('Cadastra') ? 'Cadastra' : wb.SheetNames[0];
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {defval:''});
    if(!rows.length){ toast('A planilha parece estar vazia.'); return; }
    resultado = processarLinhasPlanilha(rows);
  }catch(e){
    toast('Não foi possível ler essa planilha. Verifique o arquivo e tente novamente.');
    return;
  }
  if(!resultado.registros.length){ toast('Nenhuma linha com nome de cliente foi encontrada.'); return; }

  confirmarImportacaoPlanilha(resultado, async ()=>{
    let added = 0, updated = 0;
    const novosNomes = [];
    for(const mapped of resultado.registros){
      const existingIdxEntry = clientesIndex.find(c=>normalize(c.cliente)===normalize(mapped.cliente));
      if(existingIdxEntry){
        const full = await getClientRecord(existingIdxEntry.id);
        const rec = full || {id: existingIdxEntry.id};
        Object.keys(mapped).forEach(k=>{ if(mapped[k]) rec[k] = mapped[k]; });
        rec.id = existingIdxEntry.id;
        await storeSet('cliente:'+rec.id, JSON.stringify(rec));
        const i = clientesIndex.findIndex(c=>c.id===rec.id);
        clientesIndex[i] = buildIndexEntry(rec);
        fichaCache[rec.id] = rec;
        updated++;
      }else{
        const rec = Object.assign({
          id: uid(), imagensInt:[], imagensExt:[], imagensGoogle:[], imagensEquipamentos:[],
          transportadoras:[], obsEquipamentos:'', obsImagens:''
        }, mapped);
        await storeSet('cliente:'+rec.id, JSON.stringify(rec));
        clientesIndex.push(buildIndexEntry(rec));
        novosNomes.push(rec.cliente);
        added++;
      }
    }
    await storeSet('clientes-index', JSON.stringify(clientesIndex));
    toast(`Importação concluída: ${added} novo(s), ${updated} atualizado(s).`);
    if(novosNomes.length){
      openModal(`
        <div class="modal-box">
          <p style="font-weight:700;margin-bottom:8px;">${novosNomes.length} cliente(s) adicionado(s) como novo</p>
          <p style="font-size:var(--font-sub);color:var(--muted);">Se algum já existia com o nome levemente diferente, ele foi duplicado. Confira a lista e corrija manualmente se precisar:</p>
          <div class="ficha-grid" style="margin-top:10px;max-height:200px;overflow-y:auto;">
            ${novosNomes.map(n=>`<div class="ficha-item"><div class="v">${esc(n)}</div></div>`).join('')}
          </div>
          <div class="modal-actions"><button class="btn btn-accent" onclick="closeModal()">Entendi</button></div>
        </div>
      `);
    }
    renderContent();
  });
}

function mergeListasTexto(atual, importada){
  const resultado = atual.slice();
  (importada||[]).forEach(v=>{
    if(v && !resultado.some(x=>normalize(x)===normalize(v))) resultado.push(v);
  });
  return resultado;
}
async function processarBundleBackup(bundle){
  if(!bundle || !Array.isArray(bundle.clientes)){
    toast('Este conteúdo não parece ser um backup deste app.');
    return;
  }
  confirmAction('Isso vai somar os dados do arquivo aos que já estão aqui — nada é apagado. Continuar?', async ()=>{
    toast('Importando…');
    municipiosList = mergeListasTexto(municipiosList, bundle.municipiosList);
    classificacaoList = mergeListasTexto(classificacaoList, bundle.classificacaoList);
    rotasList = rotasList.concat((bundle.rotasList||[]).filter(r=>!rotasList.some(x=>x.id===r.id)));
    condPgtoList = mergeListasTexto(condPgtoList, bundle.condPgtoList);
    transportadoraList = mergeListasTexto(transportadoraList, bundle.transportadoraList);
    (bundle.servicosList||[]).forEach(s=>{
      if(!servicosList.some(x=>x.id===s.id)) servicosList.push(s);
    });
    await storeSet('municipios-list', JSON.stringify(municipiosList));
    await storeSet('classificacao-list', JSON.stringify(classificacaoList));
    await storeSet('rotas-list', JSON.stringify(rotasList));
    await storeSet('condpgto-list', JSON.stringify(condPgtoList));
    await storeSet('transportadora-list', JSON.stringify(transportadoraList));
    await storeSet('servicos-list', JSON.stringify(servicosList));

    let added = 0, updated = 0;
    for(const rec of bundle.clientes){
      await storeSet('cliente:'+rec.id, JSON.stringify(rec));
      const i = clientesIndex.findIndex(c=>c.id===rec.id);
      if(i>=0){ clientesIndex[i] = buildIndexEntry(rec); updated++; }
      else { clientesIndex.push(buildIndexEntry(rec)); added++; }
      fichaCache[rec.id] = rec;
    }
    await storeSet('clientes-index', JSON.stringify(clientesIndex));
    toast(`Importado: ${added} novo(s), ${updated} atualizado(s). Nada foi apagado.`);
    renderContent();
  });
}

  const file = evt.target.files[0];

async function gerarPdfListaPorRegiao(){
  const lista = window.__listaPorRegiaoData || [];
  if(!lista.length){ toast('Nada para gerar ainda.'); return; }

  const marginX = 40;
  const pageTop = 790, pageBottom = 50;
  const lineH = 15;

  let pages = [];
  let currentOps = [];
  let y = pageTop;

  function push(x, yy, text, opts){
    currentOps.push({x:x, y:yy, text:text, size:(opts&&opts.size)||9, bold: !!(opts&&opts.bold), color: opts&&opts.color});
  }
  function newPage(){
    pages.push(currentOps);
    currentOps = [];
    y = pageTop;
  }
  function ensureSpace(needed){
    if(y - needed < pageBottom){ newPage(); }
  }

  const ordenarPorMunicipioPdf = (a,b)=>{
    const m = (a.municipio||'').localeCompare(b.municipio||'','pt-BR');
    return m!==0 ? m : a.cliente.localeCompare(b.cliente,'pt-BR');
  };
  function desenharGrupoMunicipios(clientesRegiao){
    const porMunicipio = {};
    clientesRegiao.forEach(c=>{
      const chave = c.municipio || 'Sem município';
      (porMunicipio[chave] = porMunicipio[chave] || []).push(c);
    });
    const nomes = Object.keys(porMunicipio).sort((a,b)=>a.localeCompare(b,'pt-BR'));
    nomes.forEach(nome=>{
      ensureSpace(lineH*2);
      push(marginX, y, nome, {size:10, bold:true});
      y -= lineH;
      porMunicipio[nome].forEach(c=>{
        ensureSpace(lineH);
        push(marginX+10, y, String(c.cliente).slice(0,44), {bold:true});
        y -= lineH;
      });
      ensureSpace(lineH);
      push(marginX+10, y, 'Total ' + nome + ': ' + porMunicipio[nome].length, {size:8});
      y -= lineH + 4;
    });
  }

  const tituloRegiao = filtroRegiaoLista==='todas' ? 'Todas as Regiões' : labelRegiao(filtroRegiaoLista);
  push(marginX, y, 'Lista de Clientes - ' + tituloRegiao, {size:15, bold:true});
  y -= 20;
  push(marginX, y, 'Rota Norte - Belem / Para', {size:9});
  y -= 24;

  if(filtroRegiaoLista==='todas'){
    const grupos = {};
    lista.forEach(c=>{
      const chave = c.regiao || 'Sem região';
      (grupos[chave] = grupos[chave] || []).push(c);
    });
    const chavesOrdenadas = Object.keys(grupos).sort((a,b)=>a.localeCompare(b,'pt-BR'));
    chavesOrdenadas.forEach(chave=>{
      ensureSpace(lineH*2);
      const tituloGrupo = chave==='Sem região' ? 'Sem Região' : labelRegiao(chave);
      push(marginX, y, tituloGrupo, {size:12, bold:true, color:[0.169,0.424,0.690]});
      push(480, y, 'Total: '+grupos[chave].length, {size:9, color:[0.169,0.424,0.690]});
      y -= 18;
      desenharGrupoMunicipios(grupos[chave].slice().sort(ordenarPorMunicipioPdf));
      y -= 6;
    });
  }else{
    desenharGrupoMunicipios(lista);
  }

  ensureSpace(lineH*2);
  y -= 6;
  push(marginX, y, 'Total: ' + lista.length + ' cliente(s)', {bold:true});

  pages.push(currentOps);
  const bytes = buildPdfBytes(pages);
  await downloadPdfBytes(bytes, 'lista_clientes_regiao.pdf');
  toast('PDF gerado.');
}

/* ===================== PDF GENERATION (no external libraries) ===================== */
function pdfAsciiBytes(str){
  const bytes = [];
  for(let i=0;i<str.length;i++) bytes.push(str.charCodeAt(i) & 0xFF);
  return bytes;
}
function pdfTextBytes(str){
  const escaped = String(str).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  const bytes = [];
  for(let i=0;i<escaped.length;i++){
    let c = escaped.charCodeAt(i);
    if(c>255) c = 63; // fallback '?' for unsupported characters
    bytes.push(c);
  }
  return bytes;
}
function buildPdfBytes(pagesOps){
  const numPages = pagesOps.length;
  let nextNum = 1;
  const catalogNum = nextNum++;
  const pagesNum = nextNum++;
  const pageNums = []; for(let i=0;i<numPages;i++) pageNums.push(nextNum++);
  const contentNums = []; for(let i=0;i<numPages;i++) contentNums.push(nextNum++);
  const fontRegNum = nextNum++;
  const fontBoldNum = nextNum++;

  function obj(num, bodyBytes){
    return pdfAsciiBytes(num+' 0 obj\n').concat(bodyBytes, pdfAsciiBytes('\nendobj\n'));
  }

  const allObjs = {};
  allObjs[catalogNum] = obj(catalogNum, pdfAsciiBytes('<< /Type /Catalog /Pages '+pagesNum+' 0 R >>'));
  const kids = pageNums.map(n=>n+' 0 R').join(' ');
  allObjs[pagesNum] = obj(pagesNum, pdfAsciiBytes('<< /Type /Pages /Kids ['+kids+'] /Count '+numPages+' >>'));

  for(let i=0;i<numPages;i++){
    const pnum = pageNums[i], cnum = contentNums[i];
    const pageDict = '<< /Type /Page /Parent '+pagesNum+' 0 R /MediaBox [0 0 595 842] '+
      '/Resources << /Font << /F1 '+fontRegNum+' 0 R /F2 '+fontBoldNum+' 0 R >> >> /Contents '+cnum+' 0 R >>';
    allObjs[pnum] = obj(pnum, pdfAsciiBytes(pageDict));

    let streamBytes = [];
    pagesOps[i].forEach(op=>{
      const fontName = op.bold ? 'F2' : 'F1';
      const size = op.size || 9;
      const cor = op.color || [0,0,0];
      const corStr = cor.map(c=>c.toFixed(3)).join(' ');
      streamBytes = streamBytes.concat(pdfAsciiBytes(corStr+' rg\n'));
      streamBytes = streamBytes.concat(pdfAsciiBytes('BT /'+fontName+' '+size+' Tf 1 0 0 1 '+op.x+' '+op.y+' Tm ('));
      streamBytes = streamBytes.concat(pdfTextBytes(op.text));
      streamBytes = streamBytes.concat(pdfAsciiBytes(') Tj ET\n'));
    });
    const streamHeader = pdfAsciiBytes('<< /Length '+streamBytes.length+' >>\nstream\n');
    const streamFooter = pdfAsciiBytes('\nendstream');
    allObjs[cnum] = obj(cnum, streamHeader.concat(streamBytes, streamFooter));
  }

  allObjs[fontRegNum] = obj(fontRegNum, pdfAsciiBytes('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'));
  allObjs[fontBoldNum] = obj(fontBoldNum, pdfAsciiBytes('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'));

  let fileBytes = pdfAsciiBytes('%PDF-1.4\n');
  const offsets = {};
  const allNums = [catalogNum, pagesNum].concat(pageNums, contentNums, [fontRegNum, fontBoldNum]).sort((a,b)=>a-b);
  allNums.forEach(num=>{
    offsets[num] = fileBytes.length;
    fileBytes = fileBytes.concat(allObjs[num]);
  });

  const xrefStart = fileBytes.length;
  const maxNum = allNums[allNums.length-1];
  let xref = 'xref\n0 '+(maxNum+1)+'\n0000000000 65535 f \n';
  for(let n=1;n<=maxNum;n++){
    xref += String(offsets[n]).padStart(10,'0')+' 00000 n \n';
  }
  fileBytes = fileBytes.concat(pdfAsciiBytes(xref));
  fileBytes = fileBytes.concat(pdfAsciiBytes('trailer\n<< /Size '+(maxNum+1)+' /Root '+catalogNum+' 0 R >>\nstartxref\n'+xrefStart+'\n%%EOF'));

  return new Uint8Array(fileBytes);
}
async function downloadPdfBytes(bytes, filename){
  const blob = new Blob([bytes], {type:'application/pdf'});
  await downloadBlob(blob, filename, 'application/pdf');
}

  push(colX.skyfrota, y, String(data.totalSkyfrota), {bold:true});
  push(colX.balanca, y, String(data.totalBalanca), {bold:true});
  push(colX.total, y, String(data.totalMaquinas), {bold:true});
  y -= 28;

  const comObs = data.linhas.filter(l=>l.obs && l.obs.trim());
  if(comObs.length){
    ensureSpace(24, false);
    push(marginX, y, 'Observacoes', {size:12, bold:true});
    y -= 18;
    comObs.forEach(l=>{
      ensureSpace(14, false);
      push(marginX, y, l.cliente, {bold:true});
      y -= 12;
      const words = String(l.obs).replace(/\r/g,'').split(/\s+/);
      let line = '', wrapped = [];
      words.forEach(w=>{
        if((line+' '+w).trim().length > 95){ wrapped.push(line.trim()); line = w; }
        else line = (line+' '+w).trim();
      });
      if(line) wrapped.push(line);
      wrapped.forEach(ln=>{
        ensureSpace(12, false);
        push(marginX, y, ln);
        y -= 12;
      });
      y -= 8;
    });
  }
  pages.push(currentOps);

  const bytes = buildPdfBytes(pages);
  await downloadPdfBytes(bytes, 'relatorio_maquinas_balancas.pdf');
  toast('PDF gerado.');
}

/* ===================== TELA DE BLOQUEIO (PIN + PERGUNTA DE SEGURANÇA) ===================== */
const PIN_KEY = 'app-pin';
const SECQ_KEY = 'app-secquestion';
const SECA_KEY = 'app-secanswer';
const SECURITY_QUESTIONS = [
  'Qual o nome do seu primeiro animal de estimação?',
  'Em que cidade você nasceu?',
  'Qual o nome de solteira da sua mãe?',
  'Qual foi o nome da sua primeira escola?',
  'Qual sua comida favorita?',
  'Qual o nome do seu melhor amigo de infância?'
];
// 'setup' | 'setup-confirm' | 'setup-question' | 'enter' | 'forgot-question'
let pinStage = 'enter';
let pinFirstEntry = '';
let pendingPinValue = '';
let pinCurrentValue = '';

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function normalizeAnswer(s){ return normalize((s||'').trim()); }
function getStoredPinHash(){ try{ return localStorage.getItem(STORAGE_PREFIX+PIN_KEY); }catch(e){ return null; } }
function setStoredPinHash(hash){ try{ localStorage.setItem(STORAGE_PREFIX+PIN_KEY, hash); }catch(e){} }
function clearStoredPinHash(){ try{ localStorage.removeItem(STORAGE_PREFIX+PIN_KEY); }catch(e){} }
function getStoredSecQuestion(){ try{ return localStorage.getItem(STORAGE_PREFIX+SECQ_KEY); }catch(e){ return null; } }
function setStoredSecQuestion(q){ try{ localStorage.setItem(STORAGE_PREFIX+SECQ_KEY, q); }catch(e){} }
function getStoredSecAnswerHash(){ try{ return localStorage.getItem(STORAGE_PREFIX+SECA_KEY); }catch(e){ return null; } }
function setStoredSecAnswerHash(h){ try{ localStorage.setItem(STORAGE_PREFIX+SECA_KEY, h); }catch(e){} }

function renderLockScreen(){
  const root = document.getElementById('lockScreen');
  if(!root) return;

  if(pinStage==='setup-question'){
    root.innerHTML = `
      <div class="lock-overlay">
        <div class="lock-card">
          <div class="lock-icon">🔒</div>
          <h2>Pergunta de segurança</h2>
          <p>Use isto caso esqueça o PIN no futuro. Sem acertar a resposta, não é possível redefinir o PIN.</p>
          <div class="lock-error" id="lockError"></div>
          <div class="field" style="text-align:left;margin-bottom:10px;">
            <label>Pergunta</label>
            <select id="secQSelect">
              ${SECURITY_QUESTIONS.map(q=>`<option value="${esc(q)}">${esc(q)}</option>`).join('')}
            </select>
          </div>
          <div class="field" style="text-align:left;margin-bottom:16px;">
            <label>Sua resposta</label>
            <input type="text" id="secAnswerInput" placeholder="Digite sua resposta" onkeydown="if(event.key==='Enter') finishPinSetup();">
          </div>
          <button class="btn btn-accent" style="width:100%;justify-content:center;" onclick="finishPinSetup()">Salvar e concluir</button>
        </div>
      </div>
    `;
    const inp = document.getElementById('secAnswerInput');
    if(inp) inp.focus();
    return;
  }

  if(pinStage==='forgot-question'){
    const question = getStoredSecQuestion() || '';
    root.innerHTML = `
      <div class="lock-overlay">
        <div class="lock-card">
          <div class="lock-icon">🔒</div>
          <h2>Recuperar acesso</h2>
          <p>${esc(question)}</p>
          <div class="lock-error" id="lockError"></div>
          <div class="field" style="text-align:left;margin-bottom:16px;">
            <input type="text" id="secAnswerCheckInput" placeholder="Sua resposta" onkeydown="if(event.key==='Enter') checkForgotAnswer();">
          </div>
          <button class="btn btn-accent" style="width:100%;justify-content:center;" onclick="checkForgotAnswer()">Verificar</button>
          <div><button type="button" class="lock-forgot" onclick="cancelForgot()">Cancelar</button></div>
        </div>
      </div>
    `;
    const inp = document.getElementById('secAnswerCheckInput');
    if(inp) inp.focus();
    return;
  }

  let title, subtitle;
  if(pinStage==='setup'){ title='Criar PIN de acesso'; subtitle='Escolha um PIN de 4 dígitos para proteger o app.'; }
  else if(pinStage==='setup-confirm'){ title='Confirme o PIN'; subtitle='Digite o mesmo PIN novamente.'; }
  else { title='Cadastro de Clientes'; subtitle='Digite seu PIN para continuar.'; }

  root.innerHTML = `
    <div class="lock-overlay">
      <div class="lock-card">
        <div class="lock-icon">🔒</div>
        <h2>${esc(title)}</h2>
        <p>${esc(subtitle)}</p>
        <div class="lock-error" id="lockError"></div>
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pinInput" class="pin-visible-input" placeholder="••••" oninput="handlePinInput(this.value)" onkeydown="if(event.key==='Enter') submitPinManually();">
        <button type="button" class="btn btn-accent" style="width:160px;margin:14px auto 0;justify-content:center;" onclick="submitPinManually()">Continuar</button>
        ${pinStage==='enter' ? `<div><button type="button" class="lock-forgot" onclick="forgotPin()">Esqueceu o PIN?</button></div>` : ''}
      </div>
    </div>
  `;
  const inp = document.getElementById('pinInput');
  if(inp){ inp.value = ''; inp.focus(); }
}
let pinSubmitting = false;
async function handlePinInput(rawVal){
  const val = rawVal.replace(/[^0-9]/g,'').slice(0,4);
  pinCurrentValue = val;
  if(val.length===4 && !pinSubmitting){
    pinSubmitting = true;
    await handlePinComplete(val);
    pinSubmitting = false;
  }
}
function submitPinManually(){
  const inp = document.getElementById('pinInput');
  const val = inp ? inp.value.replace(/[^0-9]/g,'').slice(0,4) : '';
  if(val.length!==4){
    const err = document.getElementById('lockError');
    if(err) err.textContent = 'Digite os 4 dígitos do PIN.';
    return;
  }
  if(!pinSubmitting){
    pinSubmitting = true;
    handlePinComplete(val).finally(()=>{ pinSubmitting = false; });
  }
}
async function handlePinComplete(val){
  if(pinStage==='setup'){
    pinFirstEntry = val;
    pinCurrentValue = '';
    pinStage = 'setup-confirm';
    renderLockScreen();
  }else if(pinStage==='setup-confirm'){
    if(val === pinFirstEntry){
      pendingPinValue = val;
      pinCurrentValue = '';
      pinStage = 'setup-question';
      renderLockScreen();
    }else{
      pinCurrentValue = '';
      pinFirstEntry = '';
      pinStage = 'setup';
      renderLockScreen();
      const err = document.getElementById('lockError');
      if(err) err.textContent = 'Os PINs não coincidem. Tente novamente.';
    }
  }else{
    const hash = await sha256Hex(val);
    const stored = getStoredPinHash();
    if(hash === stored){
      unlockApp();
    }else{
      pinCurrentValue = '';
      renderLockScreen();
      const err = document.getElementById('lockError');
      if(err) err.textContent = 'PIN incorreto. Tente novamente.';
    }
  }
}
async function finishPinSetup(){
  const q = document.getElementById('secQSelect').value;
  const a = document.getElementById('secAnswerInput').value;
  if(!normalizeAnswer(a)){
    document.getElementById('lockError').textContent = 'Digite uma resposta antes de continuar.';
    return;
  }
  const pinHash = await sha256Hex(pendingPinValue);
  const answerHash = await sha256Hex(normalizeAnswer(a));
  setStoredPinHash(pinHash);
  setStoredSecQuestion(q);
  setStoredSecAnswerHash(answerHash);
  pendingPinValue = '';
  unlockApp();
}
function forgotPin(){
  const question = getStoredSecQuestion();
  if(!question){
    // Legacy/edge case: no security question was ever configured for this PIN.
    confirmAction('Não há pergunta de segurança configurada. Redefinir o PIN agora mesmo assim?', ()=>{
      clearStoredPinHash();
      pinStage = 'setup';
      pinCurrentValue = '';
      pinFirstEntry = '';
      renderLockScreen();
    });
    return;
  }
  pinStage = 'forgot-question';
  renderLockScreen();
}
async function checkForgotAnswer(){
  const inp = document.getElementById('secAnswerCheckInput');
  const val = inp ? inp.value : '';
  const hash = await sha256Hex(normalizeAnswer(val));
  const stored = getStoredSecAnswerHash();
  if(hash === stored){
    clearStoredPinHash();
    pinStage = 'setup';
    pinCurrentValue = '';
    pinFirstEntry = '';
    toast('Resposta correta. Crie um novo PIN.');
    renderLockScreen();
  }else{
    const err = document.getElementById('lockError');
    if(err) err.textContent = 'Resposta incorreta.';
    if(inp) inp.value = '';
  }
}
function cancelForgot(){
  pinStage = 'enter';
  pinCurrentValue = '';
  renderLockScreen();
}
function unlockApp(){
  const lockEl = document.getElementById('lockScreen');
  const shellEl = document.querySelector('.app-shell');
  if(lockEl) lockEl.innerHTML = '';
  if(shellEl) shellEl.style.display = '';
  initApp();
}
function startLockGate(){
  const stored = getStoredPinHash();
  pinStage = stored ? 'enter' : 'setup';
  pinCurrentValue = '';
  renderLockScreen();
}

/* ===================== INIT ===================== */
function getAniversariantesHoje(){
  const hoje = new Date();
  const hojeStr = String(hoje.getDate()).padStart(2,'0') + '/' + String(hoje.getMonth()+1).padStart(2,'0');
  const lista = [];
  clientesIndex.forEach(c=>{
    if(c.proprietario && formatAnivDisplay(c.anivProp) === hojeStr){
      lista.push({cliente:c.cliente, pessoa:c.proprietario, papel:'Proprietário'});
    }
    if(c.administrador && formatAnivDisplay(c.anivAdm) === hojeStr){
      lista.push({cliente:c.cliente, pessoa:c.administrador, papel:'Administrador'});
    }
  });
  return lista;
}
function renderAniversarioBanner(){
  const el = document.getElementById('aniversarioBanner');
  if(!el) return;
  const lista = getAniversariantesHoje();
  if(!lista.length){ el.innerHTML=''; return; }
  el.innerHTML = `
    <div class="aniversario-banner">
      🎉 Aniversário hoje: ${lista.map(a=>`<strong>${esc(a.pessoa)}</strong> (${esc(a.papel)} — ${esc(a.cliente)})`).join(' &nbsp;·&nbsp; ')}
    </div>
  `;
}

  document.getElementById('content').innerHTML = '<div class="card"><div class="empty-state">Carregando…</div></div>';

  await ensureSeededListasAuxiliares();

  renderContent();

    mostrarDialogoPrimeiraInstalacao();
  }
}
startLockGate();
</script>
